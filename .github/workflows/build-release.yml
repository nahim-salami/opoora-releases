# ⚠️ Ce fichier vit dans le dépôt PUBLIC opoora-releases
#    (.github/workflows/build-release.yml). La copie ici, dans le dépôt privé,
#    est la source de vérité — la reporter là-bas à chaque modification.
#
# Construit les 3 apps Flutter en récupérant le code du dépôt PRIVÉ au moment
# du build (checkout éphémère dans le runner — le code n'est jamais commité ni
# publié ici), puis publie les APK en release sur ce dépôt public.
#
# Minutes Actions : illimitées et gratuites (dépôt public).
#
# Déclenchement :
#   - repository_dispatch `release` envoyé par le dépôt privé au push d'un tag v*
#   - ou manuellement (Actions → Build & release → Run workflow)
#
# Prérequis : secret `CODE_TOKEN` dans CE dépôt — fine-grained PAT limité au
# dépôt privé Opoora, permission « Contents: Read » UNIQUEMENT (lecture seule).
#
# Les journaux de ce dépôt sont PUBLICS : la sortie des builds est masquée ; en cas
# d'échec, seules les positions fichier:ligne des erreurs sont affichées.
#
# App Client : deux APK — l'app reliée à l'API réelle, et une version de démonstration
# (--dart-define=OPOORA_DEMO=true : aucun compte ni paiement réel, code 482913).
# Une version avec un tiret (ex. v0.1.0-beta.1) est publiée en pré-version.

name: Build & release des apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier — doit être un tag du dépôt privé (ex: v0.1.0)"
        required: true
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, courier, business]
    steps:
      - name: Récupérer le code privé (éphémère, jamais publié)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Opoora
          token: ${{ secrets.CODE_TOKEN }}
          ref: ${{ env.VERSION }}
          persist-credentials: false

      # Tant que la Phase 0 n'a pas créé apps/<app>, on saute proprement.
      - name: Vérifier que l'app existe
        id: check
        run: |
          if [ -f "apps/${{ matrix.app }}/pubspec.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }} absent — build ignoré (Phase 0 pas encore faite)"
          fi

      - name: Installer Flutter
        if: steps.check.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Construire l'APK (sortie masquée)
        if: steps.check.outputs.exists == 'true'
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get > /dev/null
          mkdir -p "$GITHUB_WORKSPACE/dist"
          build() { # $1 = suffixe du nom de fichier, puis options de flutter build
            local suffix="$1"; shift
            if ! flutter build apk --release "$@" > /tmp/build.log 2>&1; then
              echo "::error::Build APK en échec — détails masqués (dépôt public). Positions :"
              grep -oE "[A-Za-z0-9_./-]+\.(dart|kts|gradle|xml|kt):[0-9]+(:[0-9]+)?" /tmp/build.log | sort -u | head -30
              grep -E "What went wrong|^> " /tmp/build.log | head -10
              exit 1
            fi
            mv build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/opoora-${{ matrix.app }}${suffix}-$VERSION.apk"
            echo "APK ${{ matrix.app }}${suffix} OK."
          }
          build ""
          if [ "${{ matrix.app }}" = "client" ]; then
            build "-demo" --dart-define=OPOORA_DEMO=true
          fi

      - name: Déposer l'artefact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist/*.apk
          retention-days: 7

  publish:
    name: Publier la release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les APK
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          APKS=(dist/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::warning::Aucun APK construit — rien à publier (normal avant la Phase 0)."
            exit 0
          fi
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          cat > /tmp/notes.md <<EOF
          Applications Opoora $VERSION (APK Android).

          - opoora-client : app Client reliée à l'API réelle (paiements FedaPay réels).
          - opoora-client-demo : app Client en démonstration, sans compte ni paiement réel (code de connexion 482913).
          - opoora-courier, opoora-business : apps Livreur et Business (en construction).
          EOF
          gh release create "$VERSION" $PRE --repo "${{ github.repository }}" --title "Opoora $VERSION" --notes-file /tmp/notes.md "${APKS[@]}"
